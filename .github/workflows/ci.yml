# CI de SmartFinance.lat: corre en cada PR y en cada push a main.
# Verifica que /es y sitemap.xml estén regenerados (check-es) y que no haya
# enlaces internos rotos en el HTML (lychee en modo offline).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: "/es legacy al día (npm run check-es)"
        run: npm run check-es

      - name: Tipos (astro check)
        run: npx astro check

      - name: Tests (motor DCF y utilidades)
        run: npm test

      - name: Build del sitio
        run: npm run build

      # El check de enlaces corre sobre dist/, no sobre el repo: la raíz web es
      # lo que genera el build (public/ + páginas Astro). Contra el repo, un
      # href="/assets/tokens.css" o "/lessons" da falso positivo porque esos
      # archivos viven en public/ o los crea Astro.
      - name: Enlaces internos del sitio construido (lychee --offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --fallback-extensions html
            './dist/**/*.html'
          fail: true
