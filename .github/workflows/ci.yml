# CI de SmartFinance.lat: corre en cada PR y en cada push a main.
#
# Todo va en UN solo job llamado `ci` porque `ci` es el check obligatorio de la
# rama main: lo que se mete aquí protege main sola, sin tocar la configuración
# de GitHub. Un job aparte tendría que darse de alta a mano y, hasta que
# alguien lo hiciera, no bloquearía nada.
#
# Orden: primero lo barato (tipos, tests, /es al día) y al final el build y las
# tres cosas que solo se pueden comprobar sobre el HTML construido — enlaces,
# guardia de SEO y presupuestos de Lighthouse.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: "/es legacy al día (npm run check-es)"
        run: npm run check-es

      - name: Tipos (astro check)
        run: npx astro check

      - name: Tests (motor DCF y utilidades)
        run: npm test

      - name: Build del sitio
        run: npm run build

      # El check de enlaces corre sobre dist/, no sobre el repo: la raíz web es
      # lo que genera el build (public/ + páginas Astro). Contra el repo, un
      # href="/assets/tokens.css" o "/lessons" da falso positivo porque esos
      # archivos viven en public/ o los crea Astro.
      - name: Enlaces internos del sitio construido (lychee --offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --fallback-extensions html
            './dist/**/*.html'
          fail: true

      # Guardia de SEO sobre el HTML ya construido: cabeza completa, sin títulos
      # ni descripciones repetidas, hreflang, sitemap y HTML diciendo lo mismo,
      # JSON-LD sin referencias @id colgando, robots.txt sin tapar nada del
      # sitemap, y api/*.js todavía en 12 (el tope del plan de Vercel: con 13 el
      # despliegue entero se cae DESPUÉS de construir). Ver el encabezado de
      # scripts/check-seo.mjs: cada regla está por un bug que ya pasó.
      - name: Guardia de SEO (npm run check-seo)
        run: npm run check-seo

      # Presupuestos de rendimiento y accesibilidad que fallan de verdad, sobre
      # seis rutas: rendimiento ≥ 88 y accesibilidad ≥ 95 en móvil, CLS ≤ 0.02 y
      # JS ≤ 180 KB de transferencia. Los umbrales y el porqué de cada uno están
      # en lighthouserc.json. Si un PR los rompe, lo que se arregla es el PR.
      - name: Presupuestos de Lighthouse (npm run check-lh)
        run: npm run check-lh

      - name: Guardar los informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
